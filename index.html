<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メンテナンス中 | SHINJO Atsushi Lab.</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f9faf8; /* 元サイトの背景色 */
      background-image: radial-gradient(circle at center, rgba(198,169,75,0.05) 0%, transparent 70%);
      color: #0b1d10;
      font-family: 'Noto Sans JP', system-ui, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    /* 元サイトの .card クラスを再現 */
    .maintenance-card {
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(198,169,75,.2);
      border-radius: 22px;
      padding: 3rem 2rem;
      box-shadow: 0 10px 28px rgba(3,7,18,.06);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    .icon {
      font-size: 3.5rem;
      margin-bottom: 24px;
    }

    h1 {
      color: #3f704c; /* 元サイトのテキスト緑 */
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      margin-bottom: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    p {
      color: #6b7280;
      line-height: 1.8;
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    .lab-name {
      font-family: 'Playfair Display', serif; /* 元サイトの英語フォント */
      font-size: 1.2rem;
      color: #c6a94b; /* ゴールド */
      font-weight: 700;
      letter-spacing: 0.05em;
      border-top: 1px solid rgba(198,169,75,.2);
      padding-top: 24px;
    }
  </style>
</head>
<body>

  <div class="maintenance-card">
    <div class="icon">🥕</div> <h1>現在、メンテナンス中です</h1>
    <p>いつもご覧いただきありがとうございます。<br>現在、サイトの更新作業を行っております。<br>完了まで今しばらくお待ちください。</p>
    <div class="lab-name">SHINJO Atsushi Lab.</div>
  </div>

</body>
</html>
