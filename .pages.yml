{
  "media": {
    "input": "images",
    "output": "/images",
    "rename": "random",
    "extensions": [
      "jpg",
      "jpeg",
      "png",
      "webp",
      "gif"
    ]
  },
  "content": [
    {
      "name": "students",
      "label": "学生",
      "type": "file",
      "path": "content/students.json",
      "format": "json",
      "fields": [
        {
          "name": "items",
          "label": "学生",
          "type": "object",
          "list": {
            "collapsible": {
              "collapsed": true,
              "summary": "{name} / {role}"
            }
          },
          "fields": [
            {
              "name": "name",
              "label": "氏名（日本語）",
              "type": "string",
              "required": true
            },
            {
              "name": "name_en",
              "label": "氏名（英語・任意）",
              "type": "string"
            },
            {
              "name": "role",
              "label": "学年・役職（日本語）",
              "type": "string"
            },
            {
              "name": "role_en",
              "label": "学年・役職（英語・任意）",
              "type": "string"
            },
            {
              "name": "photo",
              "label": "プロフィール写真",
              "type": "image"
            },
            {
              "name": "photo_position",
              "label": "写真の表示位置",
              "type": "select",
              "default": "center",
              "options": {
                "values": [
                  {
                    "name": "center",
                    "label": "中央"
                  },
                  {
                    "name": "top",
                    "label": "上寄せ"
                  }
                ]
              }
            },
            {
              "name": "bio",
              "label": "紹介文（日本語・任意）",
              "type": "text"
            },
            {
              "name": "bio_en",
              "label": "紹介文（英語・任意）",
              "type": "text"
            }
          ]
        }
      ]
    },
