    },
    {
      "name": "news",
      "label": "ニュース",
      "type": "file",
      "path": "content/news.json",
      "format": "json",
      "fields": [
        {
          "name": "items",
          "label": "ニュース",
          "type": "object",
          "list": {
            "collapsible": {
              "collapsed": true,
              "summary": "{date} / {title}"
            }
          },
          "fields": [
            {
              "name": "title",
              "label": "記事タイトル（日本語）",
              "type": "string",
              "required": true
            },
            {
              "name": "title_en",
              "label": "記事タイトル（英語・任意）",
              "type": "string"
            },
            {
              "name": "date",
              "label": "掲載日",
              "type": "date",
              "required": true,
              "options": {
                "format": "yyyy-MM-dd"
              }
            },
            {
              "name": "categories",
              "label": "カテゴリ（複数選択可）",
              "type": "select",
              "required": true,
              "default": [
                "news"
              ],
              "options": {
                "multiple": true,
                "values": [
                  {
                    "name": "news",
                    "label": "お知らせ"
                  },
                  {
                    "name": "media",
                    "label": "メディア"
                  },
                  {
                    "name": "publication",
                    "label": "論文・発表"
                  },
                  {
                    "name": "project",
                    "label": "プロジェクト"
                  }
                ]
              }
            },
            {
              "name": "body",
              "label": "本文（日本語）",
              "type": "text",
              "required": true
            },
            {
              "name": "body_en",
              "label": "本文（英語・任意）",
              "type": "text"
            },
            {
              "name": "photo",
              "label": "記事の写真（任意）",
              "type": "image"
            },
            {
              "name": "photo_alt",
              "label": "写真の説明（任意）",
              "type": "string"
            },
            {
              "name": "url",
              "label": "外部リンク（任意・https://から入力）",
              "type": "string"
            },
            {
              "name": "link_label",
              "label": "リンクの表示文（日本語・任意）",
              "type": "string"
            },
            {
              "name": "link_label_en",
              "label": "リンクの表示文（英語・任意）",
              "type": "string"
            }
          ]
        }
      ]
    }
  ]
