          "name": "items",
          "label": "卒業生",
          "type": "object",
          "list": {
            "collapsible": {
              "collapsed": true,
              "summary": "{name}"
            }
          },
          "fields": [
            {
              "name": "name",
              "label": "氏名（日本語）",
